services:
  database:
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_assistant_dev}
    ports: ['5432:5432']
    volumes: [property_assistant_database:/var/lib/postgresql/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-property_assistant} -d ${POSTGRES_DB:-property_assistant}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      {
        DATABASE_URL: 'postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-property_assistant_dev}@database:5432/${POSTGRES_DB:-property_assistant}',
      }
    ports: ['3001:3001']
    depends_on:
      database: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    env_file: .env
    environment: { NEXT_PUBLIC_API_URL: 'http://localhost:3001' }
    ports: ['3000:3000']
    depends_on: [api]
  voice-agent:
    build: { context: ., dockerfile: infra/docker/voice-agent.Dockerfile }
    env_file: .env
    environment: { INTERNAL_API_URL: 'http://api:3001' }
    ports: ['3002:3002']
    depends_on: [api]
volumes:
  property_assistant_database:
