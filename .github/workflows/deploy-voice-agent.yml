name: Deploy Voice Agent (Cloud Run)

on:
  workflow_dispatch:

concurrency:
  group: voice-agent-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1
  IMAGE: asia-south1-docker.pkg.dev/${{ secrets.WIF_PROJECT_ID }}/projectx/voice-agent:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_ID }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.WIF_PROJECT_ID }}

      - name: Build and push voice-agent image via Cloud Build
        run: gcloud builds submit --config .cloudbuild-voice-agent.yaml --substitutions "_IMAGE=${IMAGE}"

      - name: Deploy voice-agent to Cloud Run
        run: |
          gcloud run deploy rentpe-voice-agent \
            --project "${{ secrets.WIF_PROJECT_ID }}" \
            --region "${REGION}" \
            --image "${IMAGE}" \
            --port 8080 \
            --cpu 2 \
            --memory 1024Mi \
            --min-instances 1 \
            --max-instances 1 \
            --no-allow-unauthenticated \
            --platform managed \
            --quiet
